[project]
name = "temporal-ecommerce"
version = "0.1.0"
description = "Learning how to use Temporal"
readme = "README.md"
authors = [
    { name = "Siddharth Karunakaran", email = "siddharthkarunakaran@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.14.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "temporalio>=1.34.0",
]

[project.scripts]
worker = "temporal_ecommerce.worker:main"
starter = "temporal_ecommerce.starter:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]